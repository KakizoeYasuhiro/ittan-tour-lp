<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171412">
  <meta name="description" content="CF限定 Khoreカラオケオフ会のリクエスト曲リスト">
  <title>リクエスト曲リスト | Khore カラオケオフ会</title>
  <style>
    :root { color-scheme: light; font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif; }
    * { box-sizing: border-box; }
    html { min-width: 320px; }
    body { margin: 0; color: #181818; background: #171412 url("./IMG_6418.jpg") center center / cover fixed no-repeat; }
    body::before { content: ""; position: fixed; inset: 0; z-index: -1; background: rgba(247, 245, 239, .72); }
    main { width: min(1080px, calc(100% - 40px)); margin: 0 auto; padding: clamp(40px, 7vw, 92px) clamp(10px, 3vw, 32px) 64px; }
    .eyebrow { margin: 0 0 9px; font: 700 11px/1.5 Arial, sans-serif; letter-spacing: .22em; }
    h1 { margin: 0; font-size: clamp(27px, 4vw, 44px); line-height: 1.35; letter-spacing: .045em; }
    .subtitle { margin: 10px 0 0; font-size: 14px; line-height: 1.8; }
    .note { margin: 15px 0 0; padding: 0; list-style: none; font-size: 12px; line-height: 1.7; }
    .note li { display: flex; }
    .note li::before { content: "・"; flex: none; }
    .tabs { position: sticky; top: 0; z-index: 2; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; margin: 30px 0 0; padding: 8px 0; background: rgba(239, 237, 230, .45); backdrop-filter: blur(14px); }
    .tab { min-width: 0; min-height: 59px; padding: 9px 5px 7px; border: 0; border-bottom: 2px solid rgba(0, 0, 0, .25); border-radius: 0; background: transparent; color: #181818; cursor: pointer; font: inherit; text-align: center; }
    .tab strong { display: block; font-size: 13px; line-height: 1.4; }
    .tab small { display: block; margin-top: 2px; font-size: 10px; line-height: 1.4; }
    .tab[aria-pressed="true"] { border-bottom: 3px solid #181818; }
    .tab:focus-visible { outline: 3px solid #d7261e; outline-offset: 2px; }
    .section { margin-top: 30px; }
    .section[hidden] { display: none; }
    .section h2 { margin: 0 0 22px; padding-bottom: 11px; border-bottom: 1px solid #222; font-size: 19px; letter-spacing: .08em; }
    .artists { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 27px 30px; align-items: start; }
    .artist { break-inside: avoid; min-width: 0; padding-bottom: 14px; border-bottom: 1px solid rgba(0, 0, 0, .17); }
    .artist h3 { margin: 0 0 9px; font-size: 14px; line-height: 1.5; font-weight: 700; overflow-wrap: anywhere; }
    .artist ul { margin: 0; padding: 0; list-style: none; }
    .artist li { margin: 0; padding: 4px 0; font-size: 13px; line-height: 1.65; overflow-wrap: anywhere; }
    .foot { margin: 52px 0 0; font: 700 11px/1.5 Arial, sans-serif; letter-spacing: .16em; }
    @media (max-width: 800px) { .artists { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 560px) {
      body { background-attachment: scroll; }
      body::before { position: fixed; }
      body::before { background: rgba(247, 245, 239, .79); }
      main { width: calc(100% - 32px); padding: 36px 2px 48px; }
      .tabs { gap: 4px; margin-top: 24px; padding: 7px 0; }
      .tab { min-height: 62px; padding: 8px 3px; }
      .tab strong { font-size: 11px; }
      .artists { grid-template-columns: minmax(0, 1fr); gap: 24px; }
      .section { margin-top: 28px; }
      .section h2 { margin-bottom: 21px; }
      .artist li { font-size: 14px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">KHORE CF EVENT</p>
      <h1>リクエスト曲リスト</h1>
      <p class="subtitle">CF限定「一旦、ツアーで。」Khore カラオケオフ会 in OZ</p>
      <ul class="note">
        <li>リクエストはお一人様一曲までとさせていただきます</li>
        <li>リストの内容は変更する場合がございます</li>
        <li>リスト外のリクエストも受け付けますが、お応え出来ない場合がございます</li>
      </ul>
    </header>
    <nav id="category-tabs" class="tabs" aria-label="曲目の区分"></nav>
    <div id="song-list" aria-live="polite"></div>
    <p class="foot">KHORE × ITTAN TOUR</p>
  </main>
  <script>
    fetch(`./songs.json?v=${Date.now()}`)
      .then(response => { if (!response.ok) throw new Error('List unavailable'); return response.json(); })
      .then(groups => {
        const root = document.getElementById('song-list');
        const tabs = document.getElementById('category-tabs');
        const buttons = [];
        const sections = [];
        function activate(index) {
          tabs.scrollIntoView({ block: 'start' });
          buttons.forEach((button, current) => button.setAttribute('aria-pressed', String(current === index)));
          sections.forEach((section, current) => { section.hidden = current !== index; });
        }
        groups.forEach((group, index) => {
          const button = document.createElement('button');
          button.className = 'tab';
          button.type = 'button';
          button.setAttribute('aria-pressed', String(index === 0));
          const label = document.createElement('strong');
          label.textContent = group.title;
          const count = document.createElement('small');
          count.textContent = `${group.artists.reduce((total, artist) => total + artist.songs.length, 0)}曲`;
          button.append(label, count);
          button.addEventListener('click', () => activate(index));
          tabs.append(button);
          buttons.push(button);
          const section = document.createElement('section');
          section.className = 'section';
          section.hidden = index !== 0;
          const heading = document.createElement('h2');
          heading.textContent = group.title;
          section.append(heading);
          const artists = document.createElement('div');
          artists.className = 'artists';
          for (const entry of group.artists) {
            const article = document.createElement('article');
            article.className = 'artist';
            const name = document.createElement('h3');
            name.textContent = entry.name;
            const songs = document.createElement('ul');
            for (const song of entry.songs) {
              const item = document.createElement('li');
              item.textContent = song;
              songs.append(item);
            }
            article.append(name, songs);
            artists.append(article);
          }
          section.append(artists);
          root.append(section);
          sections.push(section);
        });
      })
      .catch(() => {
        document.getElementById('song-list').textContent = '曲目を読み込めませんでした。時間をおいて再度お試しください。';
      });
  </script>
</body>
</html>
